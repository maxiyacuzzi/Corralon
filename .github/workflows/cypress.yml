name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Si el secreto CYPRESS_RECORD_KEY está configurado (Settings → Secrets and
      # variables → Actions), la corrida se graba en Cypress Cloud; si no (p. ej. un
      # PR desde un fork, donde GitHub no expone secretos), corre igual sin grabar.
      - name: Run Cypress against a mocked backend
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: |
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            npm run test:e2e:record
          else
            npm run test:e2e
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
